[pytest]
# 1. Default CLI Options
# --browser: Runs tests across both Chromium and Firefox
# --headed: Opens the browser UI so you can watch executions (remove for headless CI runs)
# --slowmo: Introduces a 500ms delay between actions so you can visually follow the test
# --tb=short: Keeps stack traces short and clean in the terminal
# --html: Automatically generates a standalone HTML test report
# --reruns: Re-runs failed tests up to 2 times to ensure reliability
# --tb=short: Keeps stack traces short and clean in the terminal
# --html=reports/report.html: Generates a standalone HTML test report
# --self-contained-html: Creates a self-contained HTML report with all assets included for offline viewing
# -n: Runs tests in parallel using available CPU cores
# -s: Shows test output in the terminal
addopts = --browser chromium --browser firefox --reruns 1 --tb=short --html=reports/report.html --self-contained-html

# 2. Test Discovery Restrictions
# Restricts pytest to search only inside the 'tests' folder, speeding up discovery
testpaths = 
    tests

# 3. File and Function Naming Conventions
# Ensures pytest only picks up files and functions that match these explicit patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 4. Custom Test Markers
# Registering markers prevents pytest from throwing annoying 'unknown marker' warnings
markers =
    smoke: Critical path tests for quick verification.
    regression: Full suite testing for deep validation.
    readonly: Tests that only read data from the database.
    ui: Frontend interface visual and functional tests.
    auth: Tests dealing with login, sessions, and permissions.

# 5. Logging Configuration
# Captures and formats live log outputs directly inside your terminal during execution
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# File output configuration
log_file = logs/automation.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_file_date_format = %Y-%m-%d %H:%M:%S

